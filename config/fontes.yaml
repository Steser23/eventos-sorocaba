# Fontes de eventos lidas pelo agente.
# Para desativar uma fonte, mude "ativa" para false.

fontes:
  - id: sesc
    nome: Sesc Sorocaba
    ativa: true
    tipo: api_sesc            # API pública do Sesc: dados já estruturados, não usa LLM
    busca: sorocaba
    unidade: Sorocaba
    endereco: Rua Barão de Piratininga, 555 - Jardim Faculdade, Sorocaba
    max_paginas: 10

  - id: band
    nome: Agenda cultural da Band (Sorocaba e região)
    ativa: true
    tipo: band_agenda         # sitemap de notícias ou página da seção + extração com LLM
    url_sitemap: https://www.band.com.br/sitemap-news.xml
    url_lista: https://www.band.com.br/band-multi/sorocaba-e-regiao
    max_artigos: 2            # quantas agendas mais recentes ler por execução

  - id: sesi
    nome: Sesi Sorocaba
    ativa: true
    tipo: sesi                # lista filtrada pela unidade + página de cada evento + LLM
    url: https://www.sesisp.org.br/eventos
    unidade: SESI Sorocaba
    codigo_unidade: 06aa02cc-7de3-4805-92ff-61aff05a347a   # código do filtro "SESI Sorocaba" no site
    max_detalhes_por_execucao: 25
    cliques_veja_mais: 5      # só usado se a lista precisar do navegador

# Limites para proteger o plano gratuito do Gemini.
limites:
  max_chamadas_llm_por_execucao: 40
  max_caracteres_por_trecho: 16000   # ~4.500 tokens estimados por chamada
