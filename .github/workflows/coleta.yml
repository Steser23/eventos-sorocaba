name: Coleta de eventos

on:
  schedule:
    - cron: "17 9 * * *"   # todos os dias às 06:17 de Brasília (09:17 UTC)
  workflow_dispatch:         # botão "Run workflow" para rodar manualmente
  push:                      # roda também quando o código ou as fontes mudam
    branches: [main]
    paths: ["agente/**", "config/**", ".github/workflows/**"]

permissions:
  contents: write            # para salvar os dados coletados no repositório

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Testes rápidos
        run: python -m pytest -q

      - name: Rodar o agente
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVEDOR: ${{ vars.LLM_PROVEDOR || 'gemini' }}
          LLM_MODELO: ${{ vars.LLM_MODELO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m agente

      - name: Salvar dados no repositório
        if: always()
        run: |
          git config user.name "agente-eventos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "Coleta de $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
